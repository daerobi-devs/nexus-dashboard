services:
  nexus-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-dashboard
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5173}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - PG_ADMIN_URL=${PG_ADMIN_URL:-}
      - BUATIN_BUSINESS_EMAIL=${BUATIN_BUSINESS_EMAIL:-buatintech@gmail.com}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-nexus-assets}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
